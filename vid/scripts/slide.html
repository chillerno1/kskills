<!doctype html>
<!-- Tutorial intro/outro slide. Copy to out/<slug>/intro.html or outro.html, put the logo file
     next to it, replace the {{...}} fields, and set the colours from the product's design tokens. -->
<html lang="en"><head><meta charset="utf-8"><style>
:root{--from:#4f46e5;--to:#0ea5e9;--dot:#4f46e5;--ink:#1c1917;--muted:#57534e;--bg:#f5f5f4;--line:#e7e5e4}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink)}
.card{width:880px;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 24px 60px rgba(28,25,23,.08);animation:in .8s ease-out both}
.stripe{height:8px;background:linear-gradient(90deg,var(--from),var(--to))}
.body{padding:64px 72px 72px}
.brand{display:flex;align-items:center;gap:16px;font-size:26px;font-weight:600}
.brand img{width:64px;height:64px}
h1{margin:48px 0 20px;font-size:52px;line-height:1.1;letter-spacing:-1px;font-weight:700}
p{margin:0;font-size:24px;line-height:1.5;color:var(--muted)}
ul{margin:28px 0 0;padding:0;list-style:none}
li{font-size:22px;line-height:1.5;color:var(--muted);padding:10px 0 10px 36px;position:relative}
li:before{content:"";position:absolute;left:0;top:21px;width:14px;height:14px;border-radius:50%;background:var(--dot)}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style></head><body><div class="card"><div class="stripe"></div><div class="body">
<div class="brand"><img src="{{logo}}" alt="">{{brand}}</div>
<h1>{{title}}</h1>
{{body}}
</div></div></body></html>
